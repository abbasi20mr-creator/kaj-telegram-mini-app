<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مرکز تخصصی حقوق خانواده کاج</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #f5f7f6;
      color: #1f2933;
      font-family: Tahoma, Arial, sans-serif;
    }

    button {
      font-family: inherit;
    }

    .app {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #123c32, #1d5a49);
      color: white;
      padding: 24px 20px 28px;
      border-radius: 0 0 28px 28px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.10);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .logo {
      width: 54px;
      height: 54px;
      border-radius: 17px;
      background: rgba(255,255,255,0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      border: 1px solid rgba(255,255,255,0.20);
    }

    .brand-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .brand-subtitle {
      font-size: 12px;
      opacity: 0.82;
    }

    .welcome {
      margin-top: 25px;
    }

    .welcome-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .welcome-text {
      font-size: 13px;
      line-height: 1.9;
      opacity: 0.88;
    }

    /* Main */
    .content {
      padding: 20px 16px;
    }

    .section-title {
      font-size: 16px;
      font-weight: bold;
      margin: 5px 3px 12px;
      color: #24352f;
    }

    .services {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .service {
      background: white;
      border: 1px solid #e5ebe8;
      border-radius: 18px;
      padding: 17px 14px;
      min-height: 125px;
      text-align: right;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(20,60,50,0.045);
      transition: transform 0.12s ease;
    }

    .service:active {
      transform: scale(0.97);
    }

    .service-icon {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: #edf6f2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      margin-bottom: 12px;
    }

    .service-title {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 6px;
      color: #24352f;
    }

    .service-desc {
      color: #718079;
      font-size: 11px;
      line-height: 1.7;
    }

    /* Requests */
    .request-box {
      margin-top: 24px;
      background: white;
      border: 1px solid #e5ebe8;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(20,60,50,0.045);
    }

    .request-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 13px;
    }

    .request-title {
      font-weight: bold;
      font-size: 15px;
    }

    .status {
      background: #fff5dc;
      color: #9a6a00;
      padding: 6px 9px;
      border-radius: 9px;
      font-size: 10px;
      font-weight: bold;
    }

    .request-empty {
      background: #f7f9f8;
      border-radius: 13px;
      padding: 16px;
      text-align: center;
      color: #7a8781;
      font-size: 12px;
      line-height: 1.9;
    }

    /* Quick access */
    .quick {
      margin-top: 24px;
    }
